<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scouting App</title>
    <!-- You can link CSS files here -->
    <link rel="stylesheet" href="../CSS/teleop2.css">

</head>
<body>
    <!-- This is the visible content of the page -->



    <h1>Teleop</h1>
    <p>3322 Rebuilt Scouting</p>
    <br>
  <div class="section">

    <!-- L4 -->
    <h1>How many scored?: </h1>
    <h1 id="fuelCounter">0</h1>
    <div class="buttons">
        <button class="button" style="background-color: rgb(130, 229, 143);" id="hub1" class="incButton">+1</button>
        <button class="button" style="background-color: rgb(102, 196, 114);" id="hub5" class="incButton">+5</button>
        <button class="button" style="background-color: rgb(67, 153, 78);" id="hub10" class="incButton">+10</button>

    </div>

    <input type="range" min="0" max="100" value="90" class="slider" step="1" oninput="this.nextElementSibling.value = this.value + '%'">
    <output style="color:#e9fbff;">90%</output>

    <h1>How many passed?: </h1>
    <h1 id="passingCounter">0</h1>
    <div class="buttons">
        <button class="button" style="background-color: rgb(150, 195, 224);"  id="pass1" class="incButton">+1</button>
        <button class="button" style="background-color: rgb(110, 157, 189);"  id="pass5" class="incButton">+5</button>
        <button class="button" style="background-color: rgb(92, 139, 170);"  id="pass10" class="incButton">+10</button>

    </div>

    <h2>Accuracy</h2>
    <input type="range" min="0" max="100" value="90" class="slider" step="1" oninput="this.nextElementSibling.value = this.value + '%'">
    <output style="color:#e9fbff;">90%</output>

    <button class="undo-button" id="undo">Undo</button>
    
        <!-- You can link JavaScript files here -->
    <script type="module" src="/scripts/data/DataHandler.js"></script>
    <script type="module" src="/scripts/match-scouting/teleop2.js"></script>
</body>
</html>
