<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scouting App</title>
    <!-- You can link CSS files here -->
    <link rel="stylesheet" href="../CSS/teleop2.css">

</head>
<body>
    <!-- This is the visible content of the page -->

    <div class="fixedElement">
      <a id="nav-auton" href = "auton.html">
      <img src="../images/Auto-Button.png">
      </a>
      <a id="nav-teleop1" href = "teleop1.html">
      <img src="../images/Tele-button.png">
      </a>
      <a id="nav-teleop2" href = "teleop2.html">
      <img src="../images/Tele-button.png">
      </a>
      <a id="nav-teleop3" href = "teleop3.html">
      <img src="../images/Tele-button.png">
      </a>
      <a id="nav-teleop4" href = "teleop4.html">
      <img src="../images/Tele-button.png">
      </a>
      <a id="nav-endgame" href = "endgame.html">
      <img src="../images/Endgame-Button.png">
      </a>
    </div>


    <h1>Teleop</h1>
    <p>3322 Rebuilt Scouting</p>
    <br>
  <div class="section">
    <h2>Teleop</h2>

    <!-- L4 -->
    <h1>How many balls?: </h1>
    <h1 id="fuelCounter">0</h1>
    <div class="buttons">
        <button class="button" style="background-color: rgb(130, 229, 143);" id="hubSuccessIncrease1" class="incButton">+1</button>
        <button class="button" style="background-color: rgb(102, 196, 114);" id="hubSuccessIncrease5" class="incButton">+5</button>
        <button class="button" style="background-color: rgb(67, 153, 78);" id="hubSuccessIncrease10" class="incButton">+10</button>

    </div>

    <h2>Accuracy</h2>
    <input type="range" min="0" max="100" value="90" class="slider" step="1" oninput="this.nextElementSibling.value = this.value + '%'">
    <output style="color:white;">90%</output>

    <h1>How many passing?: </h1>
    <h1 id="passingCounter">0</h1>
    <div class="buttons">
        <button class="button" style="background-color: rgb(150, 195, 224);"  id="fuelHubSuccessIncrease1" class="incButton">+1</button>
        <button class="button" style="background-color: rgb(110, 157, 189);"  id="fuelHubSuccessIncrease5" class="incButton">+5</button>
        <button class="button" style="background-color: rgb(92, 139, 170);"  id="fuelHubSuccessIncrease10" class="incButton">+10</button>

    </div>

    <h2>Accuracy</h2>
    <input type="range" min="0" max="100" value="90" class="slider" step="1" oninput="this.nextElementSibling.value = this.value + '%'">
    <output style="color:white;">90%</output>

    <button class="undo-button" id="undo">Undo</button>
    
        <!-- You can link JavaScript files here -->
    <script type="module" src="Constants.js"></script>
    <script type="module" src="DataHandler.js"></script>
    <script type="module" src="teleop2.js"></script>
</body>
</html>
