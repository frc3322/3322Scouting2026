<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scouting App</title>
    <!-- You can link CSS files here -->
    <link rel="stylesheet" href="../../../CSS/auton.css">

</head>
<body>
    <!-- This is the visible content of the page -->

  

    <h1>Auton</h1>
  <div class="section">

    <!-- L4 -->
    <h1>How many scored?: </h1>
    <h1 id="fuelCounter">0</h1>
    <div class="buttons">
        <button class="button" style="background-color: rgb(130, 229, 143);" id="hub1" class="incButton">+1</button>
        <button class="button" style="background-color: rgb(102, 196, 114);" id="hub5" class="incButton">+5</button>
        <button class="button" style="background-color: rgb(67, 153, 78);" id="hub10" class="incButton">+10</button>

    </div>

    <input type="range" min="0" max="100" value="90" class="slider" step="1" oninput="this.nextElementSibling.value = this.value + '%'">
    <output style="color:#e9fbff;">90%</output>
    <button class="undo-button" id="undo">Undo</button><br>

      <label for="neutralZone">Did they use Neutral Zone?</label>
      <input type="checkbox" id="neutralZone"><br>

      <label for="Depot">Did they use Depot?</label>
      <input type="checkbox" id="depot"><br>

      <label for="Outpost">Did they use Outpost?</label>
      <input type="checkbox" id="outpost"><br>

    <select  id="Climb">
      <option value=L1>L1 Climb</option>
      <option value=L2>L2 Climb</option>
      <option value=L3>L3 Climb</option>
      <option value=Failure>Climb Failed :( </option>
    </select>


    
        <!-- You can link JavaScript files here -->
    <script type="module" src="Constants.js"></script>
    <script type="module" src="DataHandler.js"></script>
    <script type="module" src="auton.js"></script></body>
</html>
