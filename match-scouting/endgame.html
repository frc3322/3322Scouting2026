<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title</title>
    <!-- You can link CSS files here -->
    <link rel="stylesheet" href="../CSS/endgame.css">
</head>

<body>
    <!-- This is the visible content of the page -->

    <h1>Endgame</h1>

    <div class="section">

      <div class="Rating">
        <p style="font-size: 40px; font-family: Arial, Helvetica, sans-serif; ">Rating: </p>

        <div class = "Climb">
            <p>
                Climb Options:
            </p>
            <select id="climb">    
                <option value=Failure>Climb Failed :( </option>
                <option value=L1>L1 Climb</option>
                <option value=L2>L2 Climb</option>
                <option value=L3>L3 Climb</option>
            </select>

        </div>
        


        <div class = "checkerRow">
            <div class = "bumpWrap">
                <p for="bump">Did they use Bump?</p>
                <input type="checkbox" id="bump">
            </div>


            <div class = "trenchWrap">
                <p for="trench">Did they use Trench?</p>
                <input type="checkbox" id="trench">
            </div>


            <div class = "defenceWrap">
                <p for="defence">Did they do Defence?</p>
                <input type="checkbox" id="defence">
            </div>
        </div>
       

        <div class="star-Raiting">
          <p id="rate1" >&nbsp;</p><p id="rate2" ></p><p id="rate3" ></p> <p id="rate4" ></p><p id="rate5" ></p>
        </div>


        <div class = "breakDown">
            <p for="breakdown">Breakdown:</p>
            <button id="breakdown">0.00</button>
        </div>
   
        

        <div class = "input-container">
          <input class="inputText" id="initials" placeholder="scouter initials"> 
          <input class="inputText" id="teamNumber" placeholder="team number"> 
          <input class="inputText" id="matchNumber" placeholder="match number"> 
        </div>

        <div class = "comment-section"> 
          <p>Comments:</p>
          <textarea id="comments" style="font-size: 5vh; width: 30vw; height: 30vh;"> </textarea>
        </div>

        <button id="submit"> Submit</button>
        
      </div>

    </div>
   

    <div class="section" style="margin-top: 2vh">
        <div style="display:flex; justify-content: center; flex-direction: column; align-items: center;">
            <div class="qr" id="dataQR"></div>
            <div class="qr" id="commentQR"></div>
        </div>



        <button id="exit"> Exit</button>
    </div>





    <!-- You can link JavaScript files here -->

    <!-- <script src="./scripts/qrcode.min.js"></script> -->
    <!-- <script type="module" src="../scripts/qrcode.min.js"></script> -->
    <script type="module" src="../scripts/data/DataHandler.js"></script>
    <script type="module" src="../scripts/match-scouting/endgame.js"></script>

</body>

</html>
