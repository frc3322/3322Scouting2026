    <h1>Teleop</h1>
    <p>3322 Rebuilt Scouting</p>
    <br>

    <img src="../images/fuel.jpg" id = "fuel" style="width: 7%; height: auto;">
    <button class="button" style="width: 100%; height: 200px; font-size:30px;" id="timing" >Timing</button>


      <script>
        timing = [];
        bps = 0;

        document.getElementById("timing").addEventListener("click", function() {
          timing.push(Date.now());
          console.log(timing);

          if(timing.length >= 6) {
          count = 6
          total = timing[timing.length - 1] - timing[timing.length - 6];
          }
          else{
            count = timing.length;
            total = timing[timing.length - 1] - timing[0];
          }

          console.log(count);
          console.log(total);
          bps = total / (count + 0.001);

        });


        x = 0;
setInterval(() => {

  x += 10000 / (bps + 0.001);
  console.log(x);
if (x > 650) {
  x = -350;
}


  document.getElementById("fuel").style.transform =
    `translateX(${x}px)`;



}, 10);



      </script>
