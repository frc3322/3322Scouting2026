<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scouting App</title>
  <!-- You can link CSS files here -->
  <link rel="stylesheet" href="../../../CSS/teleop3.css">

</head>

<body>
  <!-- This is the visible content of the page -->



  <h1>Teleop</h1>
  <div class="section">
    <div id="toggles" class = "buttons">
      <button id="fuel-toggle" style="background-color: rgb(126, 224, 123);">Score</button>
      <button id="pass-toggle" style="background-color: rgb(123, 173, 224);">Pass</button>
      <button id="test-toggle" style="background-color: rgb(187, 187, 187);">Test</button>
    </div>
    <canvas canvas id="canvas" height="500" width="500" style="border:5px solid #d3d3d3;"></canvas>
    <input id="slider" type="range" min="0" max="100" value="0" class="slider" step="1">
    <div id="buttons">
      <div class="button-container" id="fuel">
        <button id="fuel-button" style="background-color: rgb(126, 224, 123);">
          0.00 bps
        </button>
      </div>

      <div class="button-container" id="pass">
        <button id="pass-button" style="background-color: rgb(123, 173, 224);">
          0.00 bps
        </button>
      </div>

      <div class="button-container" id="test">
        <button id="test-button" style="background-color: rgb(187, 187, 187);">
          0.00 bps
        </button>
        <button  id="rate-button" style="background-color: rgb(187, 187, 187);">
          Measure Rate
        </button>
      </div>
    </div>
  </div>

  <!-- You can link JavaScript files here -->
  <script type="module" src="../scripts/data/DataHandler.js"></script>
  <script type="module" src="../scripts/match-scouting/teleop3.js"></script>

</body>

</html>
