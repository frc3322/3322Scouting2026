<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../CSS/buttonField.css">
    <link rel="stylesheet" href="../CSS/defense.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <!-- <link rel="stylesheet" href="../CSS/teleop4.css"> -->

</head>

<body>

    <div class="section">
        <div id="buttonField" class="buttonField">

            <div class="leftField">
                <button id="leftMostButton" class="left-most-button">
                    <img src="../images-button-field/ButtonField(left-side).svg" alt="">
                    <p class="Count" id="leftButtonCount"> 0 </p>
                </button>
            </div>

            <div class="middleLeftField">
                <button id="midLeft1" class="midButton">
                    <img src="../images-button-field/rebuilt-(mid-left-1).svg">
                    <p class="CountEdge" id="midLeft1Count"> 0 </p>
                </button>
                <button id="midLeft2" class="midButton">
                    <img src="../images-button-field/rebuilt-(mid-left-2).svg">
                </button>

                <button id="midLeftHub" class="midButton">
                    <img src="../images-button-field/rebuilt-(mid-left-hub).svg" alt="">
                </button>

                <div id="midLeft3" class="midButton">
                    <img src="../images-button-field/rebuilt-(mid-left-3).svg">
                    <p class="CountMid" id="midLeft3Count"> 0 </p>
                </div>
                <button id="midLeft4" class="midButton">
                    <img src="../images-button-field/rebuilt-(mid-left-4).svg">
                </button>
            </div>

            <div class="middle-zone">
                <button id="midZone" class="midZoneButton">
                    <img src="../images-button-field/rebuilt-(mid-zone).svg" alt="">
                    <p class="midZoneLine" id="midZoneCount"> 0</p>
                </button>
            </div>

            <div class="middleRightField">
                <button id="midRight1" class="midButton">
                    <img src="../images-button-field/rebuilt-(mid-right-1).svg">
                    <p class="CountEdge" id="midRight1Count"> 0 </p>
                </button>
                <button id="midRight2" class="midButton">
                    <img src="../images-button-field/rebuilt-(mid-right-2).svg">
                </button>

                <button id="midRightHub" class="midButton">
                    <img src="../images-button-field/rebuilt-(mid-left-hub).svg" alt="">
                </button>

                <div id="midRight3" class="midButton">
                    <img src="../images-button-field/rebuilt-(mid-right-3).svg">
                    <p class="CountMid" id="midRight3Count"> 0 </p>
                </div>
                <button id="midRight4" class="midButton">
                    <img src="../images-button-field/rebuilt-(mid-right-4).svg">
                </button>
            </div>

            <div class="rightField">
                <button id="rightMostButton" class="right-most-button">
                    <img src="../images-button-field/ButtonField(rightside).svg" alt="">
                    <p class="Count" id="rightButtonCount"> 0 </p>
                </button>
            </div>
        </div>


        <div id="fuelbuttons">
            <div id="buttons" class="button-container" style="margin:2.5vh">

                <button style="background-color: rgb(117, 171, 205);" id="down1" class="button">-1</button>
                <div id="counterText">
                    <h2>Steal Cycles: </h2>
                    <h2 id="CyclesCounter">0</h2>
                </div>
                <button style="background-color: rgb(161, 196, 218);" id="up1" class="button">+1</button>


            </div>
        </div>
        
        <p>Defense Rating:</p>
        <div class="stars">
            <p id="rate1" class="star"></p>
            <p id="rate2" class="star"></p>
            <p id="rate3" class="star"></p>
            <p id="rate4" class="star"></p>
            <p id="rate5" class="star"></p>

        </div>
    
        <p>Defense Comments:</p>
        <textarea id="comments" style="font-size: 2vw; width: 50vw; height: 10vh;"></textarea><br>
    </div>


    <script type="module" src="/scripts/data/DataHandler.js"></script>
    <script type="module" src="/scripts/match-scouting/defense.js"></script>




</body>

</html>
