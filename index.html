<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scouting App</title>
    <!-- You can link CSS files here -->
    <link rel="stylesheet" href="CSS/stylesheet.css">
    <link rel="stylesheet" href="CSS/extraStyling.css">
    <link rel="stylesheet" href="CSS/prompt.css">

</head>
<body style="background-color:rgb(70, 129, 145);"> 
    <!-- This is the visible content of the page -->

    <img src="images/Screenshot 2026-02-28 at 12.27.47 PM.png" style="width: 25%; height: auto;">

    <h1>Eagle Evolution Rebuilt Scouting!!!!!!!!! </h1>
    

    <img class = "logo" id="logo"src="images/DouglassRemovedBackground.png">
    <image src="images/DouglassSpeechBubble.png"  style="width: 20%;">

    <button id="show-data-tag" class="scout-button"><p>Show Data Tag</p></button>

    <button id="settings" class="scout-button"><p>Settings</p></button>

    <div class="prompt">

      <h2 id="promptTitle">What are your initals? (Ex. SCJ)</h2>
      <input class = "promptOneInput" type="text" id="promptInput" placeholder="Type here..."/>
    
      <h2 id="promptTitle"> What match number is this? (Ex. 42) </h2>
      <input class = "promptThreeInput" type="text" id="promptInput" autofocus />

      <button class = "startScouting"> GET TO SCOUTING!!! </button>

    </div>
    <!-- You can link JavaScript files here -->
    <script type="module" src="./scripts/Constants.js"></script>
    <script type="module" src="./scripts/data/DataContainer.js"></script>
    <script type="module" src="./scripts/data/DataHandler.js"></script>
    <script type="module" src="./scripts/main.js"></script>
    <br><br><br><br><br>
    <image src="images/DouglassRemovedBackground.png" id="Douglass" style="width: 10%; height: auto;">
    
      <script>

        x = 0;
        setInterval(() => {

        x += 2.5;
        if (x > window.innerWidth / 2) {
          x = - window.innerWidth / 2;
        }
        angle = Math.sin(x/25) * 20;

          document.getElementById("Douglass").style.transform =
            `translateX(${x}px) rotate(${angle}deg)`;



        }, 10);

      </script>

</body>
</html>
