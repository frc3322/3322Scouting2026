<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Card Opening Animation</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle, #1e1e2f, #0f0f1a);
        font-family: Arial, sans-serif;
        color: white;
    }

    .deck {
        position: relative;
        width: 200px;
        height: 300px;
        cursor: pointer;
    }

    .card {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 12px;
        background: linear-gradient(135deg, #6a5acd, #00bfff);
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        transition: transform 0.6s ease, box-shadow 0.3s ease;
        transform-style: preserve-3d;
    }


    .deck:hover .card {
        transform: translateY(-10px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.7);
    }

    /* opening animation */
    .card.open {
        animation: openCard 1s forwards;
    }

    @keyframes openCard {
        0% {
            transform: rotateY(0deg) scale(1);
        }
        50% {
            transform: rotateY(90deg) scale(1.1);
        }
        100% {
            transform: rotateY(180deg) scale(1.2);
        }
    }

    .front, .back {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 12px;
        backface-visibility: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .front {
        background: linear-gradient(135deg, #6a5acd, #00bfff);
    }

    .back {
        background: linear-gradient(135deg, #ff7f50, #ffcc00);
        transform: rotateY(180deg);
        color: black;
        font-weight: bold;
    }

    .revealed {
        position: absolute;
        bottom: -60px;
        width: 100%;
        text-align: center;
        opacity: 0;
        transition: opacity 0.5s ease;
    }

    .revealed.show {
        opacity: 1;
    }
</style>
</head>
<body>

<div class="deck" id="deck">
    <div class="card" id="mainCard">
        <div class="front">🎴</div>
        <div class="back">✨ Rare Card!</div>
    </div>
    <div class="card"></div>
    <div class="card"></div>

    <div class="revealed" id="text">
        You pulled something awesome!
    </div>
</div>

<script>
const deck = document.getElementById("deck");
const card = document.getElementById("mainCard");
const text = document.getElementById("text");

deck.addEventListener("click", () => {
    card.classList.add("open");

    setTimeout(() => {
        text.classList.add("show");
    }, 800);
});
</script>

</body>
</html>
